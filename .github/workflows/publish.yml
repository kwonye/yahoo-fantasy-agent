name: Publish npm and agent plugin

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Committed stable version to publish (for example 1.1.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release identity and committed version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = process.env.GITHUB_EVENT_NAME === 'push'
            ? process.env.GITHUB_REF_NAME.replace(/^v/, '') : process.env.INPUT_VERSION;
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Stable semver is required');
          if (pkg.name !== '@kwonye/yahoo-fantasy-mcp' || pkg.private || pkg.version !== version)
            throw new Error('Commit synchronized npm/plugin versions before releasing');
          if (pkg.repository.url !== 'git+https://github.com/kwonye/yahoo-fantasy-agent.git')
            throw new Error('Repository metadata does not match the trusted publisher');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=v${version}\n`);
          NODE
      - name: Install locked dependencies
        run: npm ci
      - name: Verify code, manifests, skills, and packages
        run: |
          npm run verify
          npm pack --dry-run
          npm run plugin:pack
          npm audit --omit=dev --audit-level=high
      - name: Test packed MCP before publishing
        run: |
          package_dir="$(mktemp -d)"
          npm pack --ignore-scripts --pack-destination "$package_dir" >/dev/null
          package_file="$(find "$package_dir" -maxdepth 1 -name '*.tgz' -print -quit)"
          npm run smoke:package -- "$package_file"
      - name: Check whether this exact commit is already published
        id: existing
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const response = await fetch(`https://registry.npmjs.org/@kwonye%2fyahoo-fantasy-mcp/${process.env.RELEASE_VERSION}`);
          if (response.status === 404) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'published=false\n');
          } else {
            if (!response.ok) throw new Error(`Registry check failed: ${response.status}`);
            const data = await response.json();
            if (data.gitHead !== process.env.GITHUB_SHA) throw new Error('Existing npm version belongs to another commit');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'published=true\n');
          }
          NODE
      - name: Publish npm through GitHub OIDC
        if: steps.existing.outputs.published != 'true'
        run: npm publish --access public --provenance
      - name: Verify registry availability and published launchers
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch(`https://registry.npmjs.org/@kwonye%2fyahoo-fantasy-mcp/${process.env.RELEASE_VERSION}`);
            if (response.ok) {
              const data = await response.json();
              if (data.version !== process.env.RELEASE_VERSION || data.gitHead !== process.env.GITHUB_SHA)
                throw new Error('Published version/commit mismatch');
              process.exit(0);
            }
            if (response.status !== 404) throw new Error(`Registry failed: ${response.status}`);
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Published version is not visible in the registry');
          NODE
          npm run smoke:package
      - name: Release plugin only after npm is verified
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          artifact="artifacts/yahoo-fantasy-agent-${RELEASE_VERSION}.tar.gz"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$artifact" --clobber
          else
            gh release create "$RELEASE_TAG" "$artifact" --target "$GITHUB_SHA" --title "Yahoo Fantasy Agent ${RELEASE_VERSION}" --generate-notes
          fi
